# Reverse proxy for NeoConf. Adjust server_name and TLS cert paths, then:
#   sudo cp deploy/proxy_params_neoconf /etc/nginx/proxy_params_neoconf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/neoconf.conf
#   sudo ln -s /etc/nginx/sites-available/neoconf.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: easiest path is certbot --nginx -d your-domain, which will rewrite
# the ssl_certificate lines below automatically.

# Rate-limit zones (defense in depth on top of the app's own in-process
# limiter — this one also blocks requests before Node has to spend CPU on them).
limit_req_zone $binary_remote_addr zone=neoconf_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=neoconf_auth:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Uncomment after certbot has provisioned certs, or let certbot do this for you.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_neoconf;
    }

    location ~ ^/api/auth/(login|register) {
        limit_req zone=neoconf_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_neoconf;
    }

    location /api/ {
        limit_req zone=neoconf_general burst=20 nodelay;
        # Matches the app's own 10MB article-upload limit; small margin for
        # multipart overhead so legitimate uploads aren't cut off mid-body.
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params_neoconf;
    }
}

